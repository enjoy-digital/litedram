# DDR3 on the Sipeed Tang Mega 138K Pro (Gowin GW5A), same settings as the LiteX-Boards target.
{
    # General ------------------------------------------------------------------
    "cpu":        "vexriscv",      # CPU type (ex vexriscv, serv, None)
    "memtype":    "DDR3",          # DRAM type
    "uart":       "rs232",         # Type of UART interface (rs232, fifo)
    "device":     "GW5AST-LV138FPG676AES", # Gowin device
    "devicename": "GW5AST-138B",   # Gowin device name (PLL configuration)

    # PHY ----------------------------------------------------------------------
    "cmd_delay":       0,            # Command/Address delay
    "sdram_module":    "H5TQ4G63EFR", # SDRAM modules of the board or SO-DIMM
    "sdram_module_nb": 2,            # Number of byte groups
    "sdram_rank_nb":   1,            # Number of ranks
    "sdram_phy":       "GW5DDRPHY",  # Type of FPGA PHY
    "sdram_rate":      "1:2",        # PHY frequency ratio (1:2 or 1:4)
    "dll_off":         True,         # DDR3 DLL-off mode (CL6/CWL6), for CK <= 125 MHz

    # Electrical ---------------------------------------------------------------
    "rtt_nom": "disabled", # Nominal termination

    # Frequency ----------------------------------------------------------------
    "input_clk_freq": 50e6, # Input clock frequency (also used for the PHY init)
    "sys_clk_freq":   50e6, # System clock frequency (DDR_clk = 2 x sys_clk)

    # Core ---------------------------------------------------------------------
    "cmd_buffer_depth": 16, # Depth of the command buffer

    # User Ports ---------------------------------------------------------------
    "user_ports": {
        "axi_0" : {
            "type": "axi",
            "id_width": 4,
        },
    },
}
